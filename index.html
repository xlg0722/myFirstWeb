<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小龙果</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#home" class="nav-brand" data-page="home">
                <img class="nav-brand__logo" src="assets/logo.png" alt="">
                <span>小龙果</span>
            </a>
            <div class="nav-links">
                <a href="#home" class="nav-link nav-link--active" data-page="home">首页</a>
                <a href="#download" class="nav-link" data-page="download">下载</a>
                <div class="nav-account" id="nav-account"></div>
            </div>
        </div>
    </nav>

    <!-- 星空背景 -->
    <div class="starfield">
        <canvas id="stars-canvas"></canvas>
    </div>

    <!-- 首页 -->
    <section class="page page--active" id="page-home">
        <div class="page-inner">
            <div class="menu-list">
                <a class="menu-button" href="#download" data-page="download">
                    <span class="menu-button__icon">
                        <img src="assets/icon.png" alt="" width="16" height="16">
                    </span>
                    <span class="menu-button__text">
                        <span class="menu-button__eyebrow">最新游戏</span>
                        <span class="menu-button__title">你的世界</span>
                    </span>
                    <span class="menu-button__version">测试版 0.1</span>
                </a>
            </div>
        </div>
    </section>

    <!-- 下载页 -->
    <section class="page" id="page-download">
        <div class="page-inner">
            <div class="menu-list">
                <a class="menu-button" href="#versions" data-page="versions">
                    <span class="menu-button__icon">
                        <img src="assets/icon.png" alt="" width="16" height="16">
                    </span>
                    <span class="menu-button__text">
                        <span class="menu-button__eyebrow">下载</span>
                        <span class="menu-button__title">你的世界下载</span>
                    </span>
                    <span class="menu-button__version">测试版 0.1</span>
                </a>
            </div>
        </div>
    </section>

    <!-- 版本列表 -->
    <section class="page" id="page-versions">
        <div class="page-inner">
            <a class="back-link" href="#download" data-page="download">← 返回下载</a>
            <div class="menu-list">
                <button class="menu-button menu-button--version" id="download-latest" type="button">
                    <span class="menu-button__text">
                        <span class="menu-button__title menu-button__title--sm">yourworld-v0.1-win64</span>
                    </span>
                    <span class="menu-button__version">Windows 64 位</span>
                </button>
            </div>
            <p class="download-msg" id="download-msg"></p>
        </div>
    </section>

    <!-- 登录 -->
    <section class="page" id="page-login">
        <div class="page-inner">
            <a class="back-link" href="#home" data-page="home">← 返回首页</a>
            <h2 class="panel-title">登录</h2>
            <form class="auth-form" id="login-form" autocomplete="on" novalidate>
                <label class="field">
                    <span class="field__label">邮箱</span>
                    <input class="field__input" type="email" name="email" autocomplete="email" required>
                </label>
                <label class="field">
                    <span class="field__label">密码</span>
                    <input class="field__input" type="password" name="password" autocomplete="current-password" required>
                </label>
                <button class="menu-button auth-submit" type="submit">登录</button>
                <p class="auth-msg" role="alert"></p>
                <p class="auth-switch">还没有账号？<a href="#register" data-page="register">注册</a></p>
            </form>
        </div>
    </section>

    <!-- 注册 -->
    <section class="page" id="page-register">
        <div class="page-inner">
            <a class="back-link" href="#home" data-page="home">← 返回首页</a>
            <h2 class="panel-title">注册</h2>
            <form class="auth-form" id="register-form" novalidate>
                <label class="field">
                    <span class="field__label">邮箱</span>
                    <input class="field__input" type="email" name="email" autocomplete="email" required>
                </label>
                <label class="field">
                    <span class="field__label">密码</span>
                    <input class="field__input" type="password" name="password" autocomplete="new-password" required>
                </label>
                <label class="field">
                    <span class="field__label">确认密码</span>
                    <input class="field__input" type="password" name="confirm" autocomplete="new-password" required>
                </label>
                <div class="field">
                    <span class="field__label">邮箱验证码</span>
                    <div class="code-row">
                        <input class="field__input field__input--otp" type="text" name="token" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="6 位数字">
                        <button class="code-send" id="send-code" type="button">发送验证码</button>
                    </div>
                </div>
                <button class="menu-button auth-submit" type="submit">注册并登录</button>
                <p class="auth-msg" role="alert"></p>
                <p class="auth-switch">已有账号？<a href="#login" data-page="login">登录</a></p>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
